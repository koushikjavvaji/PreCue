name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PortAudio (Linux, for the microphone library)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools  # the runner's own copies can be old and unsafe
          # the CPU-only build of torch: much smaller, and the tests need no GPU
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Check dependencies for known security problems
        if: runner.os == 'Linux'
        run: |
          pip install pip-audit
          pip-audit

      - name: Offline tests (no keys, no microphone)
        run: python -m pytest tests -q

      - name: Windows overlay with real windows (hidden from screen capture)
        if: runner.os == 'Windows'
        env:
          PRECUE_UI_TESTS: "1"
        run: python -m pytest tests/test_overlay_tk.py -v

  launcher:
    # A fresh computer with no setup: double-click PreCue (run it unattended), let it install itself,
    # then check that the app answers and its search model loads.
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Start PreCue the way a user does, then check it answers and its search model loads
        shell: bash
        env:
          PRECUE_NO_BROWSER: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmd //c PreCue.bat > launcher.log 2>&1 < /dev/null &
          else
            ./PreCue.command > launcher.log 2>&1 < /dev/null &
          fi
          for i in $(seq 1 240); do
            state=$(curl -s -m 5 http://127.0.0.1:8765/api/state || true)
            if echo "$state" | grep -q '"model_ready": true'; then break; fi
            sleep 5
          done
          tail -20 launcher.log
          [[ "$state" == *'"model_ready": true'* ]] || { echo "PreCue never got ready"; exit 1; }
          [[ "$state" == *'"model_error": ""'* ]] || { echo "the search model failed: $state"; exit 1; }
          # Fetch first, then look: "curl | grep -q" can fail at random (grep stops reading, curl then errors)
          page=$(curl -s http://127.0.0.1:8765/)
          [[ "$page" == *"<title>PreCue</title>"* ]] || { echo "the app page is missing"; exit 1; }
          echo "PreCue installed itself and is ready"

  install:
    # The one-line install from the website, on a fresh computer: download, set up, start.
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Run the one-line install, then check PreCue answers and its search model loads
        shell: bash
        env:
          PRECUE_NO_BROWSER: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File docs/install.ps1 > install.log 2>&1 < /dev/null &
          else
            sh docs/install.sh > install.log 2>&1 < /dev/null &
          fi
          for i in $(seq 1 240); do
            state=$(curl -s -m 5 http://127.0.0.1:8765/api/state || true)
            if echo "$state" | grep -q '"model_ready": true'; then break; fi
            sleep 5
          done
          tail -20 install.log
          [[ "$state" == *'"model_ready": true'* ]] || { echo "PreCue never got ready"; exit 1; }
          [[ "$state" == *'"model_error": ""'* ]] || { echo "the search model failed: $state"; exit 1; }
          test -f "$HOME/PreCue/PreCue.command" || { echo "PreCue was not installed in the home folder"; exit 1; }
          echo "The one-line install works"
