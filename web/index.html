<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>PreCue Live</title>
<style>
  :root {
    --bg: #faf9f5; --line: #e9e6dc; --text: #1f1e1d; --soft: #4d4b46; --muted: #8a877f;
    --brand: linear-gradient(135deg, #e8916b 0%, #d97757 50%, #c4603c 100%);
    --red: #dc2626; --green: #15803d; --blue: #1d4ed8; --amber: #b45309;
    --ease: cubic-bezier(.2, .8, .2, 1); --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; color: var(--text); -webkit-font-smoothing: antialiased;
         background: radial-gradient(80vmax 60vmax at 0% -20%, rgba(217, 119, 87, .14), transparent 60%),
                     radial-gradient(70vmax 50vmax at 100% -10%, rgba(232, 145, 107, .12), transparent 60%), var(--bg);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line);
           background: rgba(250, 249, 245, .85); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: -.02em; }
  .logo span { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); }
  #status { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--soft);
            padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--line); }
  #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #status.listening::before { background: var(--green); box-shadow: 0 0 0 4px rgba(21, 128, 61, .12); }
  #status.reconnecting::before, #status.offline::before { background: var(--amber); }
  #note { padding: 6px 24px; font-size: 13px; color: var(--muted); min-height: 1.6em; }
  main { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; padding: 0 24px 24px; height: calc(100vh - 92px); }
  section { display: flex; flex-direction: column; min-height: 0; border-radius: 20px; border: 1px solid var(--line);
            background: #fff; box-shadow: 0 1px 2px rgba(31, 30, 29, .04), 0 8px 28px -12px rgba(31, 30, 29, .14); overflow: hidden; }
  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--soft); margin: 0; padding: 16px 20px 12px;
       border-bottom: 1px solid var(--line); font-weight: 650; }
  .scroll { flex: 1; overflow-y: auto; padding: 14px 20px 20px; }
  #transcript p { display: flex; gap: 10px; align-items: flex-start; margin: 0 -10px; padding: 8px 10px; border-radius: 12px; animation: rise .4s var(--ease) both; }
  #transcript p span:first-child { flex: 1; }
  #transcript p.ok { background: linear-gradient(90deg, rgba(21, 128, 61, .06), transparent 70%); }
  #transcript p.wrong { background: linear-gradient(90deg, rgba(220, 38, 38, .07), transparent 80%); }
  .badge { flex: none; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; animation: pop .45s var(--spring) both; }
  .badge.ok { color: var(--green); background: rgba(21, 128, 61, .09); }
  .badge.bad { color: var(--red); background: rgba(220, 38, 38, .08); }
  .badge.off { color: var(--muted); background: #f3f1ea; }
  #partial { color: var(--muted); margin: 8px 0 0; }
  .card { position: relative; border-radius: 16px; padding: 12px 16px 12px 18px; margin-bottom: 12px; border: 1px solid var(--line);
          overflow: hidden; animation: slide .6s var(--spring) both; }
  .card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .card.alert { background: linear-gradient(135deg, rgba(220, 38, 38, .08), rgba(220, 38, 38, .02)); border-color: rgba(220, 38, 38, .25); }
  .card.alert::before { background: var(--red); }
  .card.suggest { background: linear-gradient(135deg, rgba(29, 78, 216, .08), rgba(29, 78, 216, .02)); border-color: rgba(29, 78, 216, .22); }
  .card.suggest::before { background: var(--blue); }
  .card .kind { font-size: 11.5px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
  .card.alert .kind { color: var(--red); }
  .card.suggest .kind { color: var(--blue); }
  .card .time { float: right; font-size: 12px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
  .empty { color: var(--muted); font-size: 14px; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes slide { from { opacity: 0; transform: translateX(24px) scale(.97); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; height: auto; padding: 0 16px 16px; }
    header { padding: 12px 16px; } #note { padding: 6px 16px; }
    section { max-height: 60vh; }
    #alerts { order: -1; }  /* small window: alerts first, they matter most */
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<header>
  <div class="logo"><span></span>PreCue</div>
  <span id="status" class="offline">Connecting...</span>
</header>
<div id="note"></div>
<main>
  <section>
    <h2>Live transcript</h2>
    <div class="scroll" id="transcript-scroll">
      <div id="transcript"><p class="empty" id="waiting">Waiting for speech...</p></div>
      <p id="partial"></p>
    </div>
  </section>
  <section id="alerts">
    <h2>Alerts and suggestions</h2>
    <div class="scroll"><div id="cards"><p class="empty" id="no-cards">Nothing yet. PreCue stays quiet while you are right.</p></div></div>
  </section>
</main>
<script>
  const transcript = document.getElementById("transcript");
  const scroller = document.getElementById("transcript-scroll");
  const partial = document.getElementById("partial");
  const cards = document.getElementById("cards");
  const status = document.getElementById("status");
  const note = document.getElementById("note");
  const LABELS = { alert: "Check this", suggest: "Next point" };
  const VERDICTS = { correct: ["ok", "✓ Verified"], wrong: ["bad", "✕ Check this"], not_in_document: ["off", "Not in report"] };

  function removeEl(id) { const el = document.getElementById(id); if (el) el.remove(); }

  function addSentence(text) {
    removeEl("waiting");
    const p = document.createElement("p");
    const said = document.createElement("span");
    said.textContent = text;  // textContent, never innerHTML: speech text is never run as code
    p.dataset.text = text;
    p.append(said);
    transcript.appendChild(p);
    partial.textContent = "";
    scroller.scrollTop = scroller.scrollHeight;
  }

  function markSentence(text, verdict) {
    const look = VERDICTS[verdict];
    const p = [...transcript.querySelectorAll("p")].reverse().find((x) => x.dataset.text === text && !x.dataset.verdict);
    if (!p || !look) return;
    p.dataset.verdict = verdict;
    p.classList.add(look[0] === "ok" ? "ok" : look[0] === "bad" ? "wrong" : "none");
    const badge = document.createElement("span");
    badge.className = "badge " + look[0];
    badge.textContent = look[1];
    p.append(badge);
  }

  function addCard(event) {
    removeEl("no-cards");
    const card = document.createElement("div");
    card.className = "card " + event.type;
    const kind = document.createElement("div");
    kind.className = "kind";
    kind.textContent = LABELS[event.type];
    const time = document.createElement("span");
    time.className = "time";
    time.textContent = event.time || "";
    kind.appendChild(time);
    const text = document.createElement("div");
    text.textContent = event.text;
    card.append(kind, text);
    cards.prepend(card);  // newest on top
  }

  function setStatus(text, state) {
    status.textContent = text;
    status.className = state;
  }

  const source = new EventSource("/events");
  source.onopen = () => setStatus("Connected", "listening");
  source.onerror = () => setStatus("PreCue is not running", "offline");  // the browser retries by itself
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type === "final") addSentence(event.text);
    else if (event.type === "partial") partial.textContent = event.text;
    else if (event.type === "verdict") markSentence(event.text, event.verdict);
    else if (event.type === "status") setStatus(event.text, event.state);
    else if (event.type in LABELS) addCard(event);
    else if (event.type === "skipped") note.textContent = event.time + "  " + event.text;  // minor: no card
  };
</script>
</body>
</html>
