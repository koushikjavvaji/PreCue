<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PreCue Overlay</title>
<style>
  /* The window behind this page is transparent: only the cards are visible. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font: 14.5px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", sans-serif;
         padding: 6px; -webkit-font-smoothing: antialiased; }
  .card { position: relative; display: flex; gap: 11px; align-items: flex-start; color: #fff; border-radius: 14px;
          padding: 11px 14px 13px 12px; margin-bottom: 8px; overflow: hidden;
          box-shadow: 0 10px 28px -6px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .14) inset;
          animation: in .55s cubic-bezier(.34, 1.56, .64, 1) both; transition: opacity .6s, transform .6s; }
  .card.alert { background: rgb(176, 32, 32); }    /* solid colours: easy to read over any slide */
  .card.suggest { background: rgb(29, 84, 170); }
  .card.fading { opacity: 0; transform: translateX(14px); }
  .icon { flex: none; width: 24px; height: 24px; border-radius: 8px; background: rgba(255, 255, 255, .18);
          display: grid; place-items: center; font-weight: 800; font-size: 14px; margin-top: 1px; }
  .kind { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .85; margin-bottom: 1px; }
  .text { font-weight: 500; }
  .time-left { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: rgba(255, 255, 255, .45);
               transform-origin: left; animation: shrink linear forwards; }
  @keyframes in { from { opacity: 0; transform: translateX(40px) scale(.96); } }
  @keyframes shrink { to { transform: scaleX(0); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>
<div id="cards"></div>
<script>
  // Small pop-ups for the meeting: an alert or suggestion appears, stays a few seconds, then fades.
  // Nothing else is shown, so the overlay is invisible while the speaker is doing fine.
  const cards = document.getElementById("cards");
  const LABELS = { alert: "Check this", suggest: "Next point" };
  const ICONS = { alert: "!", suggest: "→" };
  const SHOW_SECONDS = { alert: 10, suggest: 8 };
  const MAX_CARDS = 2;  // more than this is too much to read while speaking

  function show(event) {
    const card = document.createElement("div");
    card.className = "card " + event.type;
    const icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = ICONS[event.type];
    const body = document.createElement("div");
    const kind = document.createElement("div");
    kind.className = "kind";
    kind.textContent = LABELS[event.type];
    const text = document.createElement("div");
    text.className = "text";
    text.textContent = event.text;  // textContent, never innerHTML: speech text is never run as code
    body.append(kind, text);
    const timeLeft = document.createElement("div");
    timeLeft.className = "time-left";
    timeLeft.style.animationDuration = SHOW_SECONDS[event.type] + "s";  // shows how long the card stays
    card.append(icon, body, timeLeft);
    cards.prepend(card);  // newest on top
    while (cards.children.length > MAX_CARDS) cards.lastChild.remove();

    setTimeout(() => card.classList.add("fading"), SHOW_SECONDS[event.type] * 1000);
    setTimeout(() => card.remove(), SHOW_SECONDS[event.type] * 1000 + 700);
  }

  // live=1: only new events. Old alerts from before the overlay opened are never shown.
  const source = new EventSource("/events?live=1");
  source.onmessage = (message) => {
    const event = JSON.parse(message.data);
    if (event.type in LABELS) show(event);
  };
</script>
</body>
</html>
